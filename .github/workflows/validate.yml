name: Validate concept repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate references, structured files and tests
        run: |
          python 03_ANWENDUNGSEBENE/SKRIPTE/check_repository.py
          python -m unittest discover -s tests -v
